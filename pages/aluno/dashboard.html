<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teclar &mdash; Aluno</title>
<link rel="stylesheet" href="../../css/base/fontes.css">
<link rel="stylesheet" href="../../css/base/tokens.css">
<link rel="stylesheet" href="../../css/base/luz.css">
<link rel="stylesheet" href="../../css/base/movimento.css">
<link rel="stylesheet" href="../../css/componentes/vidro.css">
<!-- A mesma dupla das outras telas do mundo Escola. De dashboard.css vem a
     casca (base m&iacute;nima, o fundo, .pagina, .painel, o cabe&ccedil;alho e o cart&atilde;o
     .item de cada exerc&iacute;cio); de escola.css vem o que &eacute; deste mundo &mdash; a
     nav em p&iacute;lula que a <Nav> desenha, o menu da conta, o .sr-only e os
     bot&otilde;es. escola.css vem DEPOIS, e o acr&eacute;scimo no fim dela &eacute; o que d&aacute; a
     esta tela o acabamento do desenho. -->
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="stylesheet" href="../../css/escola.css">

<!-- React vem de vendor/react/ (build ESM 18.3.1 copiado para dentro do
     projeto, sem depender de internet), n&atilde;o de node_modules. O import map traduz os
     nomes que o .js gerado pelo tsc importa. Tem de vir ANTES de qualquer
     <script type="module">. -->
<script type="importmap">
{ "imports": {
    "react": "../../vendor/react/react.mjs",
    "react-dom": "../../vendor/react/react-dom.mjs",
    "react-dom/client": "../../vendor/react/react-dom-client.mjs",
    "react/jsx-runtime": "../../vendor/react/jsx-runtime.mjs"
}}
</script>
</head>
<body>

<!-- A luz de fundo: o disco de acre&ccedil;&atilde;o no canto inferior direito (o canto
     da Escola, ver css/base/luz.css), o campo de estrelas de dashboard.css e o
     gr&atilde;o. S&oacute; pintura, e o aria-hidden diz isso a quem
     ouve a tela. Sem essa luz o backdrop-filter do vidro n&atilde;o tem o que
     desfocar e o painel vira ret&acirc;ngulo cinza. -->
<div class="fundo fundo-largo grao" aria-hidden="true">
  <div class="disco disco-canto-inferior-direito"></div>
  <div class="fundo-estrelas"></div>
</div>

<!-- O React monta a p&aacute;gina inteira aqui dentro: a nav em p&iacute;lula e, abaixo
     dela, o painel dos exerc&iacute;cios. N&Atilde;O &eacute; mais o <main class="tela">, que
     centraliza UM painel na altura da janela. O <main> de verdade vem do
     Dashboard.tsx, abaixo da nav. -->
<div id="raiz" class="pagina pagina-media pagina-aluno entrada-da-pagina"></div>

<!-- Aponta para o .js GERADO pelo tsc (npm run dev), n&atilde;o para o .tsx. -->
<script type="module" src="../../js/aluno/Dashboard.js"></script>
</body>
</html>
