<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teclar &mdash; Treino</title>
<link rel="stylesheet" href="../../css/base/fontes.css">
<link rel="stylesheet" href="../../css/base/tokens.css">
<link rel="stylesheet" href="../../css/base/movimento.css">
<link rel="stylesheet" href="../../css/componentes/vidro.css">
<link rel="stylesheet" href="../../css/componentes/toasts.css">
<link rel="stylesheet" href="../../css/componentes/modais.css">
<link rel="stylesheet" href="../../css/treino.css">

<!-- React vem de vendor/react/ (build ESM 18.3.1 copiado para dentro do
     projeto, sem depender de internet), n&atilde;o de node_modules. O import map traduz os
     nomes que o .js gerado pelo tsc importa. Tem de vir ANTES de qualquer
     <script type="module">. -->
<script type="importmap">
{ "imports": {
    "react": "../../vendor/react/react.mjs",
    "react-dom": "../../vendor/react/react-dom.mjs",
    "react-dom/client": "../../vendor/react/react-dom-client.mjs",
    "react/jsx-runtime": "../../vendor/react/jsx-runtime.mjs"
}}
</script>
</head>
<body>

<div class="fundo" aria-hidden="true"></div>

<!-- O React monta aqui o HUD, o palco, a captura invis&iacute;vel e a pausa,
     com o mesmo markup de antes. A raiz &eacute; um div sem classe: HUD,
     captura e pausa s&atilde;o position: fixed e o palco &eacute; um bloco
     comum, ent&atilde;o o CSS n&atilde;o muda. -->
<div id="raiz"></div>

<!-- Toasts: canto inferior direito, somem sozinhos, nunca pegam foco.
     Host fora da raiz do React: continua com js/componentes/toast.ts. -->
<div class="toasts" id="toasts" aria-live="polite"></div>

<!-- Aponta para o .js GERADO pelo tsc (npm run dev), n&atilde;o para o .tsx. -->
<script type="module" src="../../js/treino/Treino.js"></script>
</body>
</html>
