<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teclar &mdash; Relat&oacute;rios</title>
<meta name="description" content="Como a turma e cada aluno est&atilde;o indo: sess&otilde;es, PPM, precis&atilde;o e exerc&iacute;cios conclu&iacute;dos.">
<link rel="stylesheet" href="../../css/base/fontes.css">
<link rel="stylesheet" href="../../css/base/tokens.css">
<link rel="stylesheet" href="../../css/base/luz.css">
<link rel="stylesheet" href="../../css/base/movimento.css">
<link rel="stylesheet" href="../../css/componentes/vidro.css">
<link rel="stylesheet" href="../../css/componentes/toasts.css">
<link rel="stylesheet" href="../../css/componentes/modais.css">
<link rel="stylesheet" href="../../css/base/reset.css">
<link rel="stylesheet" href="../../css/escola.css">

<!-- React vem de vendor/react/ (build ESM 18.3.1 copiado para dentro do
     projeto, sem depender de internet), n&atilde;o de node_modules. O import map traduz os
     nomes que o .js gerado pelo tsc importa. Tem de vir ANTES de qualquer
     <script type="module">. "react-dom" (sem /client) &eacute; de onde sai o
     createPortal usado pelo ModalReact. -->
<script type="importmap">
{ "imports": {
    "react": "../../vendor/react/react.mjs",
    "react-dom": "../../vendor/react/react-dom.mjs",
    "react-dom/client": "../../vendor/react/react-dom-client.mjs",
    "react/jsx-runtime": "../../vendor/react/jsx-runtime.mjs"
}}
</script>
</head>
<body>

<!-- Luz de fundo: o disco de acre&ccedil;&atilde;o no canto inferior direito (o canto da
     Escola) e o gr&atilde;o &mdash; ver css/base/luz.css. Sem ela o backdrop-filter do
     vidro n&atilde;o tem o que desfocar. -->
<div class="fundo grao" aria-hidden="true">
  <div class="disco disco-canto-inferior-direito"></div>
  <div class="fundo-estrelas"></div>
</div>

<!-- O React monta a tela inteira aqui dentro (barra do topo, seletor de
     turma, m&eacute;tricas, abas, tabelas e estados). Fora da raiz s&oacute; fica o
     que n&atilde;o depende de estado. -->
<div id="raiz" class="pagina entrada-da-pagina"></div>

<!-- Host dos toasts: continua com js/componentes/toast.js, fora da raiz. -->
<div id="toasts"></div>

<!-- Aponta para o .js GERADO pelo tsc (npm run dev), n&atilde;o para o .tsx.
     Caixa importa: o arquivo &eacute; Relatorios.js (de Relatorios.tsx), e o
     relatorios.js min&uacute;sculo que existia vazio foi apagado justamente para
     n&atilde;o colidir com ele no Windows. -->
<!-- O campo de estrelas do fundo (js/componentes/campoDeEstrelas.ts). -->
<script type="module" src="../../js/componentes/campoDeEstrelas.js"></script>
<!-- A luz do horizonte para de respirar em m&aacute;quina lenta (js/utils/respiracaoDaLuz.ts). -->
<script type="module" src="../../js/utils/respiracaoDaLuz.js"></script>
<script type="module" src="../../js/professor/Relatorios.js"></script>
</body>
</html>
