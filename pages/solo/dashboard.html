<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teclar &mdash; Solo</title>
<meta name="description" content="A porta de entrada do Solo: seu n&iacute;vel, seu XP e o caminho para as miss&otilde;es.">
<link rel="stylesheet" href="../../css/base/fontes.css">
<link rel="stylesheet" href="../../css/base/tokens.css">
<link rel="stylesheet" href="../../css/componentes/vidro.css">

<!-- Esta tela usa as duas folhas, e a ordem importa.
     De dashboard.css vem a casca do mundo Solo que campanhas.html j&aacute; usa:
     a base m&iacute;nima, o fundo, .tela, .painel e o cabe&ccedil;alho
     (.rotulo/.titulo/.subtitulo/.btn-sair). Nada dela muda por causa desta
     tela &mdash; o lobby s&oacute; entra nos nomes que ela n&atilde;o define.
     De solo.css vem o que &eacute; s&oacute; do lobby: o campo de estrelas, a barra de
     XP, o convite, o esqueleto e os bot&otilde;es .btn/.btn-solido (que
     dashboard.css n&atilde;o tem). Vem DEPOIS de prop&oacute;sito: &eacute; ele que ajusta o
     .estado do PainelErro para painel de vidro, pelo seletor mais
     espec&iacute;fico .estado.vidro. -->
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="stylesheet" href="../../css/solo.css">

<!-- React vem de vendor/react/ (build ESM 18.3.1 copiado para dentro do
     projeto, sem depender de internet), n&atilde;o de node_modules. O import map traduz os
     nomes que o .js gerado pelo tsc importa. Tem de vir ANTES de qualquer
     <script type="module">. -->
<script type="importmap">
{ "imports": {
    "react": "../../vendor/react/react.mjs",
    "react-dom": "../../vendor/react/react-dom.mjs",
    "react-dom/client": "../../vendor/react/react-dom-client.mjs",
    "react/jsx-runtime": "../../vendor/react/jsx-runtime.mjs"
}}
</script>
</head>
<body>

<!-- A luz de fundo do mundo Solo: o anel de dashboard.css mais o campo de
     estrelas de solo.css. Os dois s&atilde;o s&oacute; pintura, e o aria-hidden diz
     isso para quem ouve a tela. -->
<div class="fundo" aria-hidden="true">
  <div class="fundo-anel"></div>
  <div class="fundo-estrelas"></div>
</div>

<!-- O React monta o painel aqui dentro. A raiz &eacute; o mesmo
     <main class="tela"> de campanhas.html, para o CSS n&atilde;o mudar. -->
<main id="raiz" class="tela"></main>

<!-- Aponta para o .js GERADO pelo tsc (npm run dev), n&atilde;o para o .tsx.
     Caixa importa: o arquivo &eacute; Lobby.js (de Lobby.tsx), e ele se chama
     Lobby justamente para n&atilde;o colidir com nenhum .js desta pasta. -->
<script type="module" src="../../js/solo/Lobby.js"></script>
</body>
</html>
