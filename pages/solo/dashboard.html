<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teclar &mdash; Solo</title>
<meta name="description" content="A porta de entrada do Solo: seu n&iacute;vel, seu XP e o caminho para as miss&otilde;es.">
<link rel="stylesheet" href="../../css/base/fontes.css">
<link rel="stylesheet" href="../../css/base/tokens.css">
<link rel="stylesheet" href="../../css/base/luz.css">
<link rel="stylesheet" href="../../css/base/movimento.css">
<link rel="stylesheet" href="../../css/componentes/vidro.css">

<!-- Esta tela usa as duas folhas, e a ordem importa. Antes delas vem
     reset.css, com a base comum a todas as telas (margens, fundo e fonte
     do body, anel de foco).
     De dashboard.css vem a casca do mundo Solo:
     o estilo neutro de links, bot&otilde;es e listas, o fundo, .tela, .painel e o cabe&ccedil;alho
     (.rotulo/.titulo/.subtitulo/.btn-sair). Nada dela muda por causa desta
     tela &mdash; o lobby s&oacute; entra nos nomes que ela n&atilde;o define.
     De solo.css vem o que &eacute; s&oacute; do lobby: a barra de XP, o convite, o esqueleto e os bot&otilde;es .btn/.btn-solido (que
     dashboard.css n&atilde;o tem). Vem DEPOIS de prop&oacute;sito: &eacute; ele que ajusta o
     .estado do PainelErro para painel de vidro, pelo seletor mais
     espec&iacute;fico .estado.vidro. -->
<link rel="stylesheet" href="../../css/base/reset.css">
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="stylesheet" href="../../css/solo.css">

<!-- React vem de vendor/react/ (build ESM 18.3.1 copiado para dentro do
     projeto, sem depender de internet), n&atilde;o de node_modules. O import map traduz os
     nomes que o .js gerado pelo tsc importa. Tem de vir ANTES de qualquer
     <script type="module">. -->
<script type="importmap">
{ "imports": {
    "react": "../../vendor/react/react.mjs",
    "react-dom": "../../vendor/react/react-dom.mjs",
    "react-dom/client": "../../vendor/react/react-dom-client.mjs",
    "react/jsx-runtime": "../../vendor/react/jsx-runtime.mjs"
}}
</script>
</head>
<body>

<!-- A luz de fundo do mundo Solo: o disco de acre&ccedil;&atilde;o entrando pelo canto
     superior direito (o canto do Solo), o campo de estrelas e o gr&atilde;o por
     cima dos dois &mdash; ver css/base/luz.css. Tudo s&oacute; pintura, e o aria-hidden
     diz isso para quem ouve a tela. -->
<div class="fundo fundo-lobby grao" aria-hidden="true">
  <div class="disco disco-canto-superior-direito"></div>
  <div class="fundo-estrelas"></div>
</div>

<!-- O React monta aqui a moldura do Solo (js/componentes/MolduraSolo.tsx)
     e, dentro dela, a grade de dois pain&eacute;is e o rodap&eacute; com a a&ccedil;&atilde;o. Sem
     .entrada-da-pagina aqui: as pe&ccedil;as da moldura s&atilde;o fixas, e o transform
     da anima&ccedil;&atilde;o as prenderia a esta div vazia. A entrada vai no conte&uacute;do,
     dentro da moldura. -->
<div id="raiz"></div>

<!-- Aponta para o .js GERADO pelo tsc (npm run dev), n&atilde;o para o .tsx.
     Caixa importa: o arquivo &eacute; Lobby.js (de Lobby.tsx), e ele se chama
     Lobby justamente para n&atilde;o colidir com nenhum .js desta pasta. -->
<!-- O campo de estrelas do fundo (js/componentes/campoDeEstrelas.ts). -->
<script type="module" src="../../js/componentes/campoDeEstrelas.js"></script>
<!-- A luz do horizonte para de respirar em m&aacute;quina lenta (js/utils/respiracaoDaLuz.ts). -->
<script type="module" src="../../js/utils/respiracaoDaLuz.js"></script>
<script type="module" src="../../js/solo/Lobby.js"></script>
</body>
</html>
