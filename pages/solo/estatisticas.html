<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teclar &mdash; Estat&iacute;sticas</title>
<meta name="description" content="Sua campanha no Solo: n&iacute;vel, XP, melhores marcas, sequ&ecirc;ncia de dias e o desempenho em cada li&ccedil;&atilde;o.">
<link rel="stylesheet" href="../../css/base/fontes.css">
<link rel="stylesheet" href="../../css/base/tokens.css">
<link rel="stylesheet" href="../../css/base/movimento.css">
<link rel="stylesheet" href="../../css/componentes/vidro.css">

<!-- A mesma dupla do lobby (dashboard.html) e das li&ccedil;&otilde;es (campanhas.html),
     na mesma ordem. De dashboard.css vem a casca do mundo Solo: a base
     m&iacute;nima, o fundo, .tela, .painel e o cabe&ccedil;alho
     (.rotulo/.titulo/.subtitulo/.btn-sair). De solo.css vem o que &eacute; s&oacute;
     deste mundo: o campo de estrelas, a barra de XP, os bot&otilde;es
     .btn/.btn-solido, o painel de estado &mdash; e, no acr&eacute;scimo do fim da
     folha, o que &eacute; s&oacute; desta tela: o painel largo, os seis n&uacute;meros, o
     filtro e a tabela s&oacute;lida. A tabela &eacute; a mesma receita do mundo Escola,
     mas escola.css N&Atilde;O &eacute; carregada aqui: cada mundo carrega a pr&oacute;pria
     folha, e as duas nunca andam juntas. -->
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="stylesheet" href="../../css/solo.css">

<!-- React vem de vendor/react/ (build ESM 18.3.1 copiado para dentro do
     projeto, sem depender de internet), n&atilde;o de node_modules. O import map traduz os
     nomes que o .js gerado pelo tsc importa. Tem de vir ANTES de qualquer
     <script type="module">. -->
<script type="importmap">
{ "imports": {
    "react": "../../vendor/react/react.mjs",
    "react-dom": "../../vendor/react/react-dom.mjs",
    "react-dom/client": "../../vendor/react/react-dom-client.mjs",
    "react/jsx-runtime": "../../vendor/react/jsx-runtime.mjs"
}}
</script>
</head>
<body>

<!-- A luz de fundo do mundo Solo: o anel de dashboard.css mais o campo de
     estrelas de solo.css. S&oacute; pintura; o aria-hidden diz isso a quem ouve. -->
<div class="fundo" aria-hidden="true">
  <div class="fundo-anel"></div>
  <div class="fundo-estrelas"></div>
</div>

<!-- O React monta o painel aqui dentro. A raiz &eacute; o mesmo
     <main class="tela"> das outras telas do Solo, para o CSS n&atilde;o mudar. -->
<main id="raiz" class="tela entrada-da-pagina"></main>

<!-- Aponta para o .js GERADO pelo tsc (npm run dev), n&atilde;o para o .tsx.
     Caixa importa: o arquivo &eacute; Estatisticas.js (de Estatisticas.tsx), e
     n&atilde;o h&aacute; nenhum estatisticas.js fonte nesta pasta para ele atropelar. -->
<script type="module" src="../../js/solo/Estatisticas.js"></script>
</body>
</html>
