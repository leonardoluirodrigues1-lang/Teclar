<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teclar &mdash; Solo</title>
<link rel="stylesheet" href="../../css/base/fontes.css">
<link rel="stylesheet" href="../../css/base/tokens.css">
<link rel="stylesheet" href="../../css/componentes/vidro.css">
<link rel="stylesheet" href="../../css/dashboard.css">

<!-- solo.css vem DEPOIS: de dashboard.css vem a casca (a base m&iacute;nima, o
     fundo, .tela, .painel, o cabe&ccedil;alho e o cart&atilde;o .item de cada li&ccedil;&atilde;o); de
     solo.css vem o que &eacute; s&oacute; deste mundo &mdash; os grupos de n&iacute;vel, a p&iacute;lula de
     repeti&ccedil;&otilde;es e os bot&otilde;es .btn/.btn-solido do PainelErro, que dashboard.css
     n&atilde;o define. A mesma dupla que o lobby (dashboard.html) carrega. -->
<link rel="stylesheet" href="../../css/solo.css">

<!-- React vem de vendor/react/ (build ESM 18.3.1 copiado para dentro do
     projeto, sem depender de internet), n&atilde;o de node_modules. O import map traduz os
     nomes que o .js gerado pelo tsc importa. Tem de vir ANTES de qualquer
     <script type="module">. -->
<script type="importmap">
{ "imports": {
    "react": "../../vendor/react/react.mjs",
    "react-dom": "../../vendor/react/react-dom.mjs",
    "react-dom/client": "../../vendor/react/react-dom-client.mjs",
    "react/jsx-runtime": "../../vendor/react/jsx-runtime.mjs"
}}
</script>
</head>
<body>

<!-- A luz de fundo do mundo Solo: o anel de dashboard.css mais o campo de
     estrelas de solo.css, como no lobby e nas estat&iacute;sticas. -->
<div class="fundo fundo-largo" aria-hidden="true">
  <div class="fundo-anel"></div>
  <div class="fundo-estrelas"></div>
</div>

<!-- O React monta a p&aacute;gina inteira aqui dentro: a nav em p&iacute;lula e, abaixo
     dela, o painel das li&ccedil;&otilde;es. N&Atilde;O &eacute; mais o <main class="tela">, que
     centraliza UM painel na altura da janela &mdash; com a nav no topo, a
     p&aacute;gina passa a ser uma coluna. O <main> de verdade vem do
     Campanhas.tsx, abaixo da nav. -->
<div id="raiz" class="pagina pagina-media"></div>

<!-- Aponta para o .js GERADO pelo tsc (npm run dev), n&atilde;o para o .tsx. -->
<script type="module" src="../../js/solo/Campanhas.js"></script>
</body>
</html>
